[package]
name = "pluto-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libcosmic.workspace = true
wgpu.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
pluto-paint.workspace = true
pluto-net.workspace = true
pluto-html.workspace = true
pluto-css.workspace = true
pluto-layout.workspace = true
pluto-ipc.workspace = true
pluto-js.workspace = true
# Stage 9 Rec 9: fcntl (CLOEXEC) on the renderer spawn path.
libc.workspace = true
# Stage 9 Rec 13: ring::digest for the download SHA-256 (computed
# as the temp file is written). ring 0.17 is already in the lock
# via rustls; named directly here.
ring = "0.17"
# Stage 9 Rec 13: `http` types (`Uri`, `HeaderMap`) for the mixed-
# download check, which reuses `pluto_net::mixed::is_mixed_download`.
http.workspace = true
# Stage 11 Rec 1: the shared rayon pool decodes images on the
# worker (never the tab thread, never the UI thread).
rayon.workspace = true
# M6 Phase 3 (Rec 12): `url` resolves relative `@font-face` URLs
# against the document base (already in the workspace lock).
url.workspace = true

[dev-dependencies]
# Stage 11 Rec 11/12: the image-pipeline tests encode real GIF/PNG
# bytes instead of hand-building them.
image.workspace = true
