[workspace]
resolver = "2"
members = [
    "crates/pluto-browser",
    "crates/pluto-net",
    "crates/pluto-html",
    "crates/pluto-css",
    "crates/pluto-layout",
    "crates/pluto-paint",
    "crates/pluto-ipc",
    "crates/pluto-js",
    "crates/pluto-media",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Shared dependency versions. These are pinned to match what the libcosmic
# pin below actually uses (see README.md "Version notes"):
#   wgpu 28 / cosmic-text 0.19 / taffy 0.15 come from libcosmic rev ecc5fe4
#   (verified against the pin's lockfile: 28.0.0 / 0.19.0 / 0.15.1).
# Using older majors here would pull a SECOND copy of each crate, and the
# wgpu::Device/Queue handed out by libcosmic would be a different type
# from the one pluto-paint sees. One version everywhere, or nothing works.
[workspace.dependencies]

# Stage 16 Phase 1, Rec 3: the M8 decode stack.
#
# Audio — symphonia 0.5.5, `default-features = false` plus exactly
# the formats Pluto plays. Codec scope, stated honestly:
# MP3 (bundle-mp3, cached in the offline registry), FLAC
# (bundle-flac 0.5.5), Vorbis in Ogg, WAV/PCM, AAC in MP4
# (isomp4). NOT covered: Opus (symphonia 0.5 has no Opus
# decoder), ALAC, ADPCM. `get_probe()` reports an unsupported
# codec as an error, never silence.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "aac", "isomp4", "pcm"] }
# Video (primary) — openh264 0.9.10 (H.264). Justification: H.264
# is the codec of the overwhelming majority of real-world web
# video, and the `source` feature builds Cisco's library from
# the vendored C++ in `openh264-sys2` (no download at build
# time). First build compiles the C++ (slow; no nasm in this
# sandbox, so the build falls back to C-only, no SIMD — decode
# still works). AV1 (rav1d 1.1.0) is deliberately NOT in this
# phase: it is a large pure-Rust decoder with a C-style API
# (`Dav1dContext` / `send_data` / `get_picture`) that needs a
# dedicated integration, and the transport + demux layers are
# codec-agnostic, so adding it later is a decoder swap, not a
# redesign. See `pluto-media`'s crate docs.
openh264 = "0.9.10"
# Demuxers — MP4: `mp4` 0.14.0. WebM: `matroska-demuxer` 0.8.1
# (pure Rust, no deps; the `webm` crate needs a C library via
# `webm-sys` and was rejected for that). WebM demux is proven;
# VP9 (the codec in the WebM fixture) has no decoder — see the
# Phase 2 VP9 decision in `pluto-media`'s crate docs: no
# VP9-capable decoder (rav1d / dav1d / libvpx) exists in the
# offline registry, so WebM/VP9 reports unsupported, never faked.
mp4 = "0.14.0"
matroska-demuxer = "0.8.1"
# Audio sink — cpal 0.15.3 (Stage 16 Phase 2, Rec 6). Linux
# builds against the system ALSA lib (present in the sandbox);
# no device is needed to build, and a missing device at runtime
# degrades to the null sink — never a hard failure.
cpal = "0.15.3"

bytes = "1"
bytemuck = "1"
tokio = { version = "1", features = ["full"] }
winnow = "0.7"
taffy = "0.15"
cosmic-text = "0.19"
wgpu = "28"
# NOTE: no `bindgen` feature. It regenerates the QuickJS bindings at build
# time, but this VM's llvm18 sysroot ships libclang without the C headers
# (bindgen dies on `stdbool.h: file not found`). rquickjs-sys falls back
# to its pre-generated bindings, same API -- M4 needs nothing from bindgen.
rquickjs = { version = "0.14", features = ["futures", "macro", "loader"] }
# NOTE: same trap as hyper-rustls below -- rustls 0.23's OWN default
# features include `aws_lc_rs`, so a bare `"0.23"` plus `ring` enables
# two providers and rustls panics at first TLS use. Defaults off, ring
# is the only provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Stage 5: pluto-net builds its rustls ClientConfig explicitly
# (ring provider, webpki roots, resumption, 0-RTT off) instead of
# relying on hyper-rustls's shorthand.
webpki-roots = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
http = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
# NOTE: `default-features = false` is load-bearing. hyper-rustls's default
# features include `aws-lc-rs`, so requesting `ring` on top enables TWO
# rustls crypto providers and rustls panics at the first TLS use
# ("could not automatically determine the process-level CryptoProvider").
# With defaults off, ring is the only provider. `native-tokio` is also
# dropped on purpose: it pulls the OS native cert store, and Pluto
# trusts webpki-roots instead.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
# Stage 16 Phase 3 (Rec 11): tokio-tungstenite 0.26.2 for the
# WebSocket transport (pairs with tungstenite 0.26.2 — NOT the
# cached tungstenite 0.30.0 / async-tungstenite 0.35.0, which pair
# with each other; tokio-tungstenite itself was NOT in the offline
# cache, but crates.io is reachable from this sandbox and the
# crate + its deps (tungstenite 0.26.2, tokio-rustls 0.26,
# webpki-roots 0.26) fetch cleanly — verified 2026-11-26 before
# depending on it). The `rustls-tls-webpki-roots` feature only
# gates the `Connector::Rustls` variant; Pluto passes its own
# `ClientConfig` (pluto-net's `tls_config()`, ring + webpki-roots
# 1.x) for `wss:`, so the feature's bundled roots are never
# consulted — they just unlock the variant.
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
# `futures-util` for `SinkExt` / `StreamExt` on the WebSocket
# stream (browser-side pump, Stage 16 Phase 3, Rec 11).
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
slotmap = "1"
thiserror = "2"
# Stage 6 (pluto-html): Pluto's own WHATWG tree-construction machine
# + tokenizer (see crates/pluto-html). url 2.5.9 was already in the
# lock as a transitive dep; pluto-html names it directly for
# base-URL resolution in the preload scanner / streaming driver.
url = "2"
# Stage 5: CancellationToken (tokio-util sync) for cancelling
# in-flight loads by navigation epoch; flate2 for gzip/deflate
# decoding of response bodies (miniz_oxide backend, already in
# the lock via transitive deps).
tokio-util = "0.7"
flate2 = "1"
# Stage 7 (pluto-js): SHA-256 for the bytecode cache key (URL + content
# hash). Already in the lock as a transitive dep; named directly here.
sha2 = "0.11"
tracing = "0.1"
# Stage 9 Rec 9: `libc` for the renderer spawn path — clearing
# CLOEXEC on the IPC socketpair end the `--renderer` child inherits
# (`fcntl`), and SIGKILL supervision. Already in the lockfile as a
# transitive dep; named directly here.
libc = "0.2"
# Stage 4: the browser<->renderer protocol (pluto-ipc) and the
# serialisable display list (pluto-paint) are serde types; postcard is
# the byte format for the in-process SubmitDisplayList payload (the
# same bytes cross IPC at M5). rayon is the single shared pool for
# parallel style (#5) and image decode (#6).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stage 16 Phase 1, Rec 1: `serde_bytes` for the video-frame
# planes (`pluto-ipc::VideoFrame`). Serde has NO fast path for
# `Vec<u8>` — it serialises byte-by-byte through the generic
# sequence impl, which measured 227 ms encode + 329 ms decode
# per 1080p frame in debug (the socket itself does 2.9 ms).
# `#[serde(with = "serde_bytes")]` routes through
# `serialize_bytes` (one memcpy) instead. The same trap applies
# to `pluto-paint::Resource::Image.rgba` (M7 path) — flagged as
# a follow-up, not changed here.
serde_bytes = "0.11"
postcard = { version = "1", features = ["alloc"] }
rayon = "1"
# Image decoding (Stage 4 #6; the <img> pipeline itself is M3).
# M3 formats only — the full default set pulls decoders Pluto never
# uses. image 0.25 is already in the lock via iced/libcosmic.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Stage 15 (M7 Phase 2, Rec 3/4): lyon 1.0 is the path tessellator
# (fill + stroke) for inline SVG. Verified present in the offline
# registry cache (lyon 1.0.19, lyon_tessellation 1.0.23,
# lyon_path 1.0.19, lyon_geom 1.0.20) before the dep was added.
# resvg/usvg are deliberately NOT added: they would pull a whole
# SVG stack and violate the from-scratch rule in spirit.
lyon = "1"
# fontdb 0.23 is the version cosmic-text 0.19 uses; pluto-paint names
# it directly to resolve serialised glyph keys back to font ids.
fontdb = "0.23"
# naga 28 is wgpu 28's shader compiler; pluto-paint names it directly
# as a dev-dependency so tests can validate the hand-written WGSL
# without a GPU (Stage 8: every shader string parses + validates
# under naga in `cargo test`).
naga = "28"
pluto-html = { path = "crates/pluto-html", version = "0.1.0" }
pluto-css = { path = "crates/pluto-css", version = "0.1.0" }
pluto-layout = { path = "crates/pluto-layout", version = "0.1.0" }
pluto-net = { path = "crates/pluto-net", version = "0.1.0" }
pluto-js = { path = "crates/pluto-js", version = "0.1.0" }

[workspace.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "ecc5fe4164e1c9024b932382d24ea41f24147e75"
default-features = false
features = ["wgpu", "tokio", "wayland", "x11"]

# Stage 12 Rec 2: QuickJS's C core must not run at -O0 in dev
# builds (what Joel actually runs with `cargo run`). Cargo sets
# OPT_LEVEL from the profile and rquickjs-sys's build script (plain
# `cc::Build`) follows it, so `opt-level = "s"` compiles the C
# with -Os in BOTH profiles without touching Rust codegen
# anywhere else. LTO is NOT shipped: Cargo forbids `lto` in a
# per-package profile (verified: "`lto` may not be specified in a
# `package` profile"), a workspace-wide `[profile.release] lto`
# would change Rust codegen for every crate (out of scope for
# this recommendation), and C-level LTO is not reachable through
# Cargo at all (`cc` takes no -flto from the profile; touching
# the vendored build script would be an engine fork, which Stage
# 12 forbids). `-Os` alone is the report's own fallback. Measured
# with the fixed workload in `pluto-js`'s
# `js_workload_benchmark_reports_timing` test: dev median
# 1625.8 ms before, see ARCHITECTURE.md for the after number.
[profile.dev.package.rquickjs-sys]
opt-level = "s"

[profile.release.package.rquickjs-sys]
opt-level = "s"

[workspace.dependencies.pluto-paint]
path = "crates/pluto-paint"
version = "0.1.0"

[workspace.dependencies.pluto-ipc]
path = "crates/pluto-ipc"
version = "0.1.0"

[workspace.dependencies.pluto-media]
path = "crates/pluto-media"
version = "0.1.0"
